# cargo-deny configuration for langchart.
#
# Run locally:   cargo deny check
# Run in CI:     cargo deny --log-level error check
#
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Target triple(s) to evaluate for. Restricting to common targets keeps the
# advisory check fast and avoids false positives from platform-specific crates.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]

# ── Advisories ──────────────────────────────────────────────────────────────────
# Deny any crate with an active security advisory unless explicitly ignored.
[advisories]
version = 2
# Yanked crates are treated as warnings only so CI does not break on minor
# administrative actions; a human should still review and update them.
yanked = "warn"

# List any advisories that have been reviewed and accepted here:
#   ignore = [{ id = "RUSTSEC-YYYY-NNNN", reason = "..." }]
ignore = []

# ── Bans ────────────────────────────────────────────────────────────────────────
[bans]
# Allow at most one version of each crate to avoid accidental duplication.
multiple-versions = "warn"
# Crates that must never appear anywhere in the dependency graph.
deny = []
# Known-duplicate crates that are acceptable for now (e.g. different major
# versions pulled in by two independent transitive deps).
skip = []
skip-tree = []

# ── Licenses ────────────────────────────────────────────────────────────────────
[licenses]
version = 2
# Acceptable SPDX license identifiers.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]
# Treat unlicensed crates as errors.
unlicensed = "deny"
# Treat copyleft licenses as errors unless explicitly allowed above.
copyleft = "deny"
# If a crate's license cannot be determined, treat as an error.
default = "deny"

# ── Sources ──────────────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io and local path dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
