[package]
name = "langchart-llm-bedrock"
description = "AWS Bedrock Converse API LLM adapter for Langchart"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
aws-config = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-credential-types = "1"
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
langchart-adapters.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
serde_json.workspace = true
