[package]
name = "langchart-llm-watsonx"
description = "IBM watsonx.ai LlmAdapter for Langchart with IAM authentication"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zlib", "zstd"] }
bytes = "1"
eventsource-stream = "0.2"
futures.workspace = true
langchart-adapters.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dev-dependencies]
flate2 = "1"
langchart-model.workspace = true
