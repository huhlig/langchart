[package]
name        = "langchart-wasm"
description = "WebAssembly bindings for langchart-model: validation and inspection in browser/editor environments."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
langchart-model = { workspace = true }
wasm-bindgen    = "0.2"
serde           = { workspace = true }
serde_json      = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
