[package]
name        = "langchart-mcp-client"
description = "MCP client McpAdapter implementation for langchart."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
langchart-adapters = { workspace = true }
langchart-model    = { workspace = true }
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["process"] }
tracing            = { workspace = true }
rmcp               = { version = "1.0.0", features = ["client", "transport-child-process"] }
