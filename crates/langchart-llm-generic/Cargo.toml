[package]
name        = "langchart-llm-generic"
description = "OpenAI and Anthropic public API LlmAdapter for langchart. Supports model enumeration and any OpenAI-compatible endpoint."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[features]
default  = ["openai", "anthropic"]
openai   = []
anthropic = []

[dependencies]
langchart-adapters = { workspace = true }
langchart-model    = { workspace = true }
async-trait        = { workspace = true }
async-compression  = { version = "0.4", features = ["tokio", "gzip", "brotli", "zlib", "deflate", "zstd"] }
brotli             = "8"
bytes              = "1"
eventsource-stream = "0.2"
flate2             = "1"
futures            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
serde_path_to_error = "0.1"
sha2               = "0.10"
thiserror          = { workspace = true }
tokio              = { workspace = true }
tokio-util         = { version = "0.7", features = ["io"] }
tracing            = { workspace = true }
zstd               = "0.13"
reqwest            = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
